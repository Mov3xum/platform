name: Deploy to Coolify Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile the web image on GitHub's runners and push it to GHCR. Coolify
  # then pulls this prebuilt image instead of compiling on the UpCloud host.
  build-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_tag: staging

  deploy:
    needs:
      - build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The web image is compiled in the job above; the typecheck here
      # remains a fast correctness gate before we trigger the Coolify pull.
      - name: Typecheck
        run: yarn typecheck

      - name: Deploy to Coolify staging
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_STAGING || secrets.COOLIFY_PROJECT_ID_STAGING }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_STAGING }}
        run: |
          set -euo pipefail

          if [ -n "${COOLIFY_DEPLOY_WEBHOOK:-}" ]; then
            echo "Using Coolify deploy webhook"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json" \
              "$COOLIFY_DEPLOY_WEBHOOK"
            exit 0
          fi

          if [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "Missing Coolify app UUID. Set COOLIFY_APP_UUID_STAGING (or legacy COOLIFY_PROJECT_ID_STAGING) in GitHub Secrets."
            exit 1
          fi

          build_coolify_base_candidates() {
            node - "$COOLIFY_BASE_URL" <<'NODE'
          const raw = (process.argv[2] || '').trim();
          if (!raw) process.exit(1);

          const seen = new Set();
          const add = (value) => {
            if (!value) return;
            const normalized = value.replace(/\/+$/, '');
            if (!normalized || seen.has(normalized)) return;
            seen.add(normalized);
            console.log(normalized);
          };

          const prefixed = /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : `https://${raw}`;
          let parsed;
          try {
            parsed = new URL(prefixed);
          } catch {
            process.exit(1);
          }

          const path = parsed.pathname && parsed.pathname !== '/' ? parsed.pathname.replace(/\/+$/, '') : '';
          const hostWithPath = `${parsed.host}${path}`;
          const hostnameWithPath = `${parsed.hostname}${path}`;

          add(`${parsed.protocol}//${parsed.host}${path}`);
          add(`https://${hostWithPath}`);
          add(`http://${hostWithPath}`);
          if (parsed.port === '8000') {
            add(`https://${hostnameWithPath}`);
            add(`http://${hostnameWithPath}`);
          }
          NODE
          }

          mapfile -t coolify_bases < <(build_coolify_base_candidates)
          if [ "${#coolify_bases[@]}" -eq 0 ]; then
            echo "Invalid COOLIFY_BASE_URL secret. Set it to the Coolify API origin or public host."
            exit 1
          fi

          encoded_identifier=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$COOLIFY_APP_UUID")
          deploy_param="uuid"
          if [[ "$COOLIFY_APP_UUID" == *:* ]]; then
            deploy_param="tag"
          fi

          try_deploy() {
            local endpoint="$1"
            echo "Trying Coolify endpoint: $endpoint"

            local http_code
            local curl_status=0
            rm -f /tmp/coolify-response.json
            http_code=$(curl -sS -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json" \
              -o /tmp/coolify-response.json \
              -w "%{http_code}" \
              "$endpoint") || curl_status=$?

            if [ "$curl_status" -ne 0 ]; then
              echo "curl exited with status $curl_status"
              if [ -f /tmp/coolify-response.json ]; then
                cat /tmp/coolify-response.json
              else
                echo "No response body was captured from Coolify."
              fi
              return 1
            fi

            if [ "$http_code" = "404" ]; then
              return 2
            fi

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              if [ -f /tmp/coolify-response.json ]; then
                cat /tmp/coolify-response.json
              fi
              return 0
            fi

            echo "Coolify deploy failed with HTTP $http_code"
            if [ -f /tmp/coolify-response.json ]; then
              cat /tmp/coolify-response.json
            else
              echo "No response body was captured from Coolify."
            fi
            return 1
          }

          for coolify_base in "${coolify_bases[@]}"; do
            echo "Trying Coolify base URL candidate: $coolify_base"
            deploy_v4="$coolify_base/api/v1/deploy?$deploy_param=$encoded_identifier&force=false"
            deploy_v1="$coolify_base/api/v1/applications/$COOLIFY_APP_UUID/start?force=false"

            v4_status=0
            if try_deploy "$deploy_v4"; then
              exit 0
            else
              v4_status=$?
            fi

            if [ "$v4_status" -eq 2 ]; then
              echo "Endpoint not found, trying legacy path..."
            else
              echo "Primary deploy endpoint failed (status=$v4_status), trying legacy path..."
            fi

            if try_deploy "$deploy_v1"; then
              exit 0
            fi

            v1_status=$?
            if [ "$v4_status" -eq 2 ] && [ "$v1_status" -eq 2 ]; then
              echo "Both Coolify deploy endpoints returned 404 for base URL $coolify_base."
            else
              echo "Coolify deploy failed on both endpoints for base URL $coolify_base."
            fi
          done

          echo "Coolify deploy failed for all base URL candidates. Verify COOLIFY_BASE_URL, COOLIFY_TOKEN, and COOLIFY_APP_UUID_STAGING."
          exit 1

      - name: Bootstrap PocketBase schema for staging
        env:
          PB_URL: ${{ secrets.PB_URL_STAGING || secrets.PB_URL }}
          PB_SU_EMAIL: ${{ secrets.PB_SU_EMAIL_STAGING || 'hampus@movexum.se' }}
          PB_SU_PASSWORD: ${{ secrets.PB_SU_PASSWORD_STAGING || secrets.PB_SU_PASSWORD }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD_STAGING || secrets.APP_USER_PASSWORD }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -euo pipefail

          if [ -z "${PB_URL:-}" ] || [ -z "${PB_SU_PASSWORD:-}" ]; then
            echo "::warning::Missing PocketBase bootstrap secrets. Skipping PB bootstrap in this deploy run."
            echo "PB_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          pb_url="${PB_URL%/}"
          if [[ "$pb_url" == http://* ]]; then
            pb_url="https://${pb_url#http://}"
          elif [[ "$pb_url" != https://* ]]; then
            pb_url="https://$pb_url"
          fi

          pb_ready=false
          max_attempts=8
          sleep_seconds=8
          consecutive_503=0
          consecutive_503_limit=2
          echo "Waiting for PocketBase auth endpoint readiness on $pb_url"
          for attempt in $(seq 1 "$max_attempts"); do
            health_code=$(curl -k -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "$pb_url/api/health" || true)
            auth_code=$(curl -k -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              -X POST \
              "$pb_url/api/collections/_superusers/auth-with-password" \
              --data '{"identity":"readiness-probe","password":"readiness-probe"}' || true)

            if [[ "$health_code" == "200" && "$auth_code" != "503" && "$auth_code" != "502" && "$auth_code" != "000" ]]; then
              echo "PocketBase ready (health=$health_code, auth=$auth_code)"
              pb_ready=true
              break
            fi

            if [[ "$health_code" == "503" && "$auth_code" == "503" ]]; then
              consecutive_503=$((consecutive_503 + 1))
            else
              consecutive_503=0
            fi

            if [[ "$consecutive_503" -ge "$consecutive_503_limit" ]]; then
              echo "Persistent 503 from health/auth for $consecutive_503 consecutive attempts. Breaking early and skipping PB bootstrap for this run."
              break
            fi

            echo "Attempt $attempt/$max_attempts: health=$health_code auth=$auth_code, waiting ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

          if [[ "$pb_ready" != "true" ]]; then
            echo "::warning::PocketBase auth endpoint not ready in time. Skipping PB bootstrap/verify in this deploy run."
            echo "PB_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "PB_READY=true" >> "$GITHUB_ENV"
          node backend/pocketbase-schema/scripts/setup-via-api.mjs

      - name: Verify PocketBase security baseline
        if: env.PB_READY == 'true'
        env:
          PB_URL: ${{ secrets.PB_URL_STAGING || secrets.PB_URL }}
          PB_SU_EMAIL: ${{ secrets.PB_SU_EMAIL_STAGING || 'hampus@movexum.se' }}
          PB_SU_PASSWORD: ${{ secrets.PB_SU_PASSWORD_STAGING || secrets.PB_SU_PASSWORD }}
          APP_USER_EMAIL: hampus@movexum.se
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD_STAGING || secrets.APP_USER_PASSWORD }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -euo pipefail
          node backend/pocketbase-schema/scripts/diagnose-migrations.mjs
          node backend/pocketbase-schema/scripts/verify-baseline.mjs
