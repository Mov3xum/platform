name: Deploy to Coolify Production

# Produktion deployas MANUELLT: workflow_dispatch från `staging` (CLAUDE.md
# § 10.3 — ingen automatisk promotion). Push-triggern på `production`/`main`
# finns kvar för bakåtkompatibilitet (`main` är en historisk gren som inte
# längre tas emot mergar). Varje produktionsdeploy bygger om HELA
# Coolify-stacken via sync-pocketbase-production (PB-imagen får repots
# migrations + hooks — utan det driftar PB-containern och verify-baseline
# faller på t.ex. tenant-vakten, incident 2026-11-25).
on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

# Serialisera produktionsdeployer (samma grupp som sync-pocketbase-production).
concurrency:
  group: coolify-production
  cancel-in-progress: false

jobs:
  build-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_tag: production

  typecheck:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

  # Bygg om produktions-stacken (PB + web) och kör schema-sync + verify.
  # Körs vid VARJE produktionsdeploy — deployerna är sällsynta och manuella,
  # och en stack-rebuild är enda sättet att garantera att PB-containern kör
  # repots migrations/hooks (setup-via-api är bara regel-sync, § 23.4).
  sync-pocketbase:
    needs:
      - build-image
      - typecheck
    uses: ./.github/workflows/sync-pocketbase-production.yml
    secrets: inherit

