name: Build & push PocketBase image

# Reusable workflow: compiles the PocketBase schema image on GitHub's runners
# and pushes it to GHCR. Coolify then PULLS this prebuilt image instead of
# rebuilding PocketBase on the UpCloud host during deploy.

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Moving tag to publish (staging | production)'
        required: true
        type: string
    outputs:
      image:
        description: 'Fully-qualified image repository that was pushed (without tag)'
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image repository (GHCR requires lowercase owner)
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="${OWNER,,}"
          echo "image=ghcr.io/${owner_lc}/platform-pocketbase" >> "$GITHUB_OUTPUT"
          echo "Publishing to ghcr.io/${owner_lc}/platform-pocketbase:${{ inputs.image_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PocketBase image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/pocketbase-schema/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          # GitHub Actions layer cache keeps the binary download and image
          # layers warm across deploys.
          cache-from: type=gha,scope=pocketbase-${{ inputs.image_tag }}
          cache-to: type=gha,mode=max,scope=pocketbase-${{ inputs.image_tag }}
          provenance: false